# Project kind: this layer holds the .NET Open XML CLI, checked by `mise run check` (format, build
# and tests with warnings as errors, and a NativeAOT publish). Its goals live in the coordinator's
# roadmap (standards-lab/context/roadmap.toml), under experiment.ai.spike-ai-pipeline.
# `mise run currency` reports every NuGet package, mise tool, and GitHub Action pin behind its
# latest. No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. The merge waits on
# the pull request's checks, CI's check on x64 and arm64, and merges only once they pass.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr checks --watch && gh pr merge --merge --delete-branch"
