# Project kind: this layer holds the .NET Open XML CLI, checked by `mise run check` (format, build
# and tests with warnings as errors, and a NativeAOT publish). Its goals live in the coordinator's
# roadmap (standards-lab/context/roadmap.toml), under experiment.ai.spike-ai-pipeline.
# `mise run currency` reports every NuGet package and mise tool behind its latest. No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform and the commands that publish and merge a finished branch. No CI runs yet, so
# the merge doesn't wait on pull-request checks; the task that adds CI makes it wait.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
