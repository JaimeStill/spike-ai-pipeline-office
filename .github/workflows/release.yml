# Release runs on a pushed version tag, vX.Y.Z, which the release procedure pushes only once main's
# CI has passed; nothing here tags. Each runner builds the NativeAOT binary natively, linux-x64 and
# linux-arm64, and refuses to pack it unless its --version is the tag's version, so the tag must
# match the version the csproj records. The last job creates the GitHub release from the tag's
# CHANGELOG.md section and attaches both archives and their SHA256SUMS, so a release appears only
# whole. Runs for one tag are serialized and never cancelled.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.ref_name }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7.0.1

      # NativeAOT links with clang against zlib.
      - name: Install the NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - uses: jdx/mise-action@v5.2.5

      # The release binary's version is the csproj's alone: without the commit suffix the check's
      # builds carry (0.1.0+<sha>), --version prints exactly the recorded version.
      - name: Publish
        run: >-
          dotnet publish src/SpikeAiPipeline.Office -c Release -r "$RID" -warnaserror
          -p:IncludeSourceRevisionInInformationalVersion=false -o out

      - name: Check the version against the tag
        run: |
          version=$(out/spike-ai-pipeline-office --version)
          if [ "$version" != "${TAG#v}" ]; then
            echo "release: the binary's version is $version, the tag's is ${TAG#v}"
            exit 1
          fi

      - name: Pack
        run: |
          mkdir pack
          cp out/spike-ai-pipeline-office LICENSE pack/
          tar -czf "spike-ai-pipeline-office-$TAG-$RID.tar.gz" -C pack spike-ai-pipeline-office LICENSE

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: spike-ai-pipeline-office-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.tar.gz >SHA256SUMS

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: CHANGELOG.md

      - name: Attach the archives and SHA256SUMS
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS
