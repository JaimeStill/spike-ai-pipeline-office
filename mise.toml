# mise: the toolchain and the check and currency tasks.
[tools]
dotnet = "10.0.400"
jq = "1.8.2"
shellcheck = "0.11.0"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.check]
description = "Format, build, test, and publish the CLI with NativeAOT, all warnings as errors; writes only bin/, obj/, and .state/"
run = '''
set -eu
cd "$MISE_PROJECT_ROOT"
git ls-files -z '*.sh' | xargs -0 -r shellcheck
dotnet format --verify-no-changes
dotnet build -warnaserror
dotnet test --no-build
case "$(uname -m)" in
  x86_64) rid=linux-x64 ;;
  aarch64) rid=linux-arm64 ;;
  *) echo "check: no runtime identifier for $(uname -m)"; exit 1 ;;
esac
dotnet publish src/SpikeAiPipeline.Office -c Release -r "$rid" -warnaserror -o .state/aot
.state/aot/SpikeAiPipeline.Office --version
'''

[tasks.currency]
description = "Report every NuGet package and mise tool behind its latest; writes nothing"
run = "scripts/currency.sh"
