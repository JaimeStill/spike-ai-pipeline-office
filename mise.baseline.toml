# The baseline tier's tools, loaded only with MISE_ENV=baseline (`mise run baseline` sets it), so
# neither the check nor CI installs them, and never in the shipped binary.
[tools]
"pipx:markitdown" = { version = "0.1.9", extras = "docx,xlsx,pptx" }

[tools."github:xberg-io/xberg"]
version = "1.3.10"

[tools."github:xberg-io/xberg".platforms]
linux-x64 = { asset_pattern = "xberg-cli-x86_64-unknown-linux-gnu.tar.gz" }
linux-arm64 = { asset_pattern = "xberg-cli-aarch64-unknown-linux-gnu.tar.gz" }
